name: Atualizar dados do futebol

on:
  schedule:
    # Toda quinta-feira as 12:00 no horario de Brasilia (UTC-3, sem horario
    # de verao) = 15:00 UTC. O GitHub Actions sempre usa UTC no cron, entao
    # o horario abaixo (15h) ja esta convertido para UTC.
    - cron: "0 15 * * 4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias minimas
        run: pip install requests

      - name: Baixar dados da planilha
        run: python scripts/fetch_data.py

      - name: Commitar dados atualizados (se houver mudanca)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/base_jogos.csv
          git diff --cached --quiet || git commit -m "chore: atualizar dados do futebol de quarta"
          git push
